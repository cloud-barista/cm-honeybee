# Any value below may be written either as a literal or as a ${VAR} reference.
# A ${VAR} value is resolved from the process environment at startup (e.g.
# injected by docker-compose / kubernetes), so endpoints and credentials do not
# have to be committed to this file. A literal is used as-is. If a ${VAR} is set
# but the environment variable is unset, the value resolves to empty (a warning
# is logged) rather than falling back to a default.
cm-honeybee:
    listen:
        port: 8081
    agent:
        port: 8082
    spider:
        endpoint: http://cb-spider:1024/spider
        # Prefer injecting credentials from the environment, e.g.:
        #   username: ${SPIDER_USERNAME}
        #   password: ${SPIDER_PASSWORD}
        username: default
        password: default
