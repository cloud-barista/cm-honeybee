name: cm-honeybee

# cm-honeybee with its own dedicated OpenBao secrets backend.
#
#   openbao-honeybee       — OpenBao server (persistent file storage, KV v2) —
#                            DEDICATED to cm-honeybee (not shared)
#   openbao-honeybee-init  — init + KV enable + unseal, then an auto-unseal watcher
#   cm-honeybee            — the honeybee server, wired to reach its OpenBao
#
# Service names start with "openbao" on purpose: cm-mayfly classifies/preserves
# OpenBao services by that prefix (secrets category, `remove --clean-db` keep).
#
# Bring up:   docker compose up -d
# Verify:     see openbao/README.md
services:
  # Dedicated OpenBao for cm-honeybee — stores its SSH access secrets and CSP
  # credentials (KV v2). https://openbao.org/
  openbao-honeybee:
    image: openbao/openbao:2.5.1
    container_name: openbao-honeybee
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    entrypoint: ["sh", "-c"]
    command:
      - |
        chown -R openbao:openbao /openbao/data 2>/dev/null || true
        exec docker-entrypoint.sh server -config=/openbao/config/openbao-config.hcl
    ports:
      - "8200:8200"
    volumes:
      - ./data/openbao/data:/openbao/data
      - ./data/openbao/secrets:/openbao/secrets
      - ./openbao/openbao-config.hcl:/openbao/config/openbao-config.hcl:ro
    healthcheck:
      # bao status: 0=unsealed, 1=sealed, 2=uninitialized — all mean "running".
      test: ["CMD", "sh", "-c", "rc=0; bao status || rc=$$?; [ $$rc -le 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Initializes + enables KV v2 + unseals OpenBao, then keeps it unsealed across
  # restarts (OpenBao always comes back up SEALED). See openbao-init.sh.
  openbao-honeybee-init:
    image: openbao/openbao:2.5.1
    container_name: openbao-honeybee-init
    restart: unless-stopped
    depends_on:
      openbao-honeybee:
        condition: service_healthy
    environment:
      - BAO_ADDR=http://openbao-honeybee:8200
    entrypoint: ["sh", "/openbao/openbao-init.sh"]
    volumes:
      - ./data/openbao/secrets:/openbao/secrets
      - ./openbao/openbao-init.sh:/openbao/openbao-init.sh:ro
    healthcheck:
      # Healthy only when OpenBao is actually UNSEALED (bao status rc 0) AND the
      # token is published. Gating on unseal — not just token-file existence —
      # is what keeps cm-honeybee from starting against a still-sealed OpenBao
      # after a restart (the token file survives from the previous boot).
      test: ["CMD", "sh", "-c", "bao status >/dev/null 2>&1 && test -f /openbao/secrets/honeybee.token"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s

  cm-honeybee:
    image: cloudbaristaorg/cm-honeybee:edge
    container_name: cm-honeybee
    restart: unless-stopped
    pull_policy: always
    depends_on:
      # Wait until OpenBao is initialized AND unsealed (not just token present).
      openbao-honeybee-init:
        condition: service_healthy
    environment:
      # SSH access secrets + CSP credentials are stored in this dedicated OpenBao
      # (KV v2). SQLite no longer holds secrets.
      - HONEYBEE_VAULT_ADDR=http://openbao-honeybee:8200
      - HONEYBEE_VAULT_TOKEN_FILE=/run/openbao/honeybee.token
    ports:
      - "8081:8081" # server
      - "8082:8082" # agent proxy
    volumes:
      - ./data/cm-honeybee/:/root/.cm-honeybee/:rw
      # Read-only access to the published OpenBao token.
      - ./data/openbao/secrets:/run/openbao:ro
