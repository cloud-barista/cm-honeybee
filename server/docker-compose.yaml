name: cm-honeybee

# cm-honeybee with its own dedicated OpenBao secrets backend.
#
#   openbao-honeybee  — OpenBao server (persistent file storage, KV v2),
#                       DEDICATED to cm-honeybee (not shared)
#   cm-honeybee       — the honeybee server. It performs OpenBao init/unseal/
#                       KV-enable ITSELF (HONEYBEE_VAULT_MANAGE=true) and waits
#                       until OpenBao is usable before serving, so it recovers on
#                       its own after host reboots / volume loss — no init sidecar.
#
# The service name starts with "openbao" on purpose: cm-mayfly classifies and
# preserves OpenBao services by that prefix.
#
# Bring up:   docker compose up -d
services:
  # Dedicated OpenBao for cm-honeybee — stores its SSH access secrets and CSP
  # credentials (KV v2). https://openbao.org/
  openbao-honeybee:
    image: openbao/openbao:2.5.1
    container_name: openbao-honeybee
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    entrypoint: ["sh", "-c"]
    command:
      - |
        chown -R openbao:openbao /openbao/data 2>/dev/null || true
        exec docker-entrypoint.sh server -config=/openbao/config/openbao-config.hcl
    ports:
      - "8200:8200"
    volumes:
      - ./data/openbao/data:/openbao/data
      - ./openbao/openbao-config.hcl:/openbao/config/openbao-config.hcl:ro
    healthcheck:
      # bao status: 0=unsealed, 1=sealed, 2=uninitialized — all mean "running".
      # cm-honeybee itself does init/unseal, so "running" is enough here.
      test: ["CMD", "sh", "-c", "rc=0; bao status || rc=$$?; [ $$rc -le 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  cm-honeybee:
    image: cloudbaristaorg/cm-honeybee:edge
    container_name: cm-honeybee
    restart: unless-stopped
    pull_policy: always
    depends_on:
      # Only needs OpenBao to be running; cm-honeybee initializes/unseals it.
      openbao-honeybee:
        condition: service_healthy
    environment:
      # SSH access secrets + CSP credentials are stored in this dedicated OpenBao
      # (KV v2). SQLite no longer holds secrets.
      - HONEYBEE_VAULT_ADDR=http://openbao-honeybee:8200
      # Self-manage OpenBao: cm-honeybee runs init/unseal/KV-enable itself and
      # persists the unseal key + root token under its data dir
      # (/root/.cm-honeybee/openbao-init.json), so it recovers after restarts.
      - HONEYBEE_VAULT_MANAGE=true
    ports:
      - "8081:8081" # server
      - "8082:8082" # agent proxy
    volumes:
      - ./data/cm-honeybee/:/root/.cm-honeybee/:rw
