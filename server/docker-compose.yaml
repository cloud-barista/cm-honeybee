name: cm-honeybee

# cm-honeybee with its own dedicated OpenBao secrets backend.
#   openbao-honeybee  — OpenBao server (file storage, KV v2)
#   cm-honeybee       — honeybee server; runs OpenBao init/unseal/KV-enable
#                       itself and waits until OpenBao is usable before serving.
#
# Bring up:   docker compose up -d
services:
  # Dedicated OpenBao for cm-honeybee's SSH access secrets and CSP credentials
  # (KV v2). https://openbao.org/
  openbao-honeybee:
    image: openbao/openbao:2.5.1
    container_name: openbao-honeybee
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    entrypoint: ["sh", "-c"]
    command:
      - |
        chown -R openbao:openbao /openbao/data 2>/dev/null || true
        exec docker-entrypoint.sh server -config=/openbao/config/openbao-config.hcl
    ports:
      - "8200:8200"
    volumes:
      - ./data/openbao/data:/openbao/data
      - ./openbao/openbao-config.hcl:/openbao/config/openbao-config.hcl:ro
    healthcheck:
      # 0=unsealed, 1=sealed, 2=uninitialized — all mean "running"; cm-honeybee
      # does the init/unseal, so "running" is enough to depend on.
      test: ["CMD", "sh", "-c", "rc=0; bao status || rc=$$?; [ $$rc -le 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  cm-honeybee:
    image: cloudbaristaorg/cm-honeybee:edge
    container_name: cm-honeybee
    restart: unless-stopped
    pull_policy: always
    depends_on:
      # Only needs OpenBao to be running; cm-honeybee initializes/unseals it.
      openbao-honeybee:
        condition: service_healthy
    environment:
      # cm-honeybee self-manages OpenBao (init/unseal/KV-enable); the unseal key +
      # root token are stored RSA-encrypted in its DB.
      - HONEYBEE_VAULT_ADDR=http://openbao-honeybee:8200
    ports:
      - "8081:8081" # server
      - "8082:8082" # agent proxy
    volumes:
      - ./data/cm-honeybee/:/root/.cm-honeybee/:rw
